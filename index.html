<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Week 1</title>
</head>
<body>
  <h1>Week 1</h1>
  <p id="result"></p>

  <script>
    // VARIABLES
    let limit = 2;
    let text = "";

    // FOR LOOP: runs 3 times, i is 1, then 2, then 3
    for (let i = 1; i <= 3; i++) {

      // IF-ELSE: compares the current number with the limit
      if (i > limit) {
        text = text + "test " + i + " is bigger than " + limit + "<br>";
      } else {
        text = text + "test " + i + " is smaller than or equal to " + limit + "<br>";
      }
    }

    // puts the text on the page
    document.getElementById("result").innerHTML = text;
  </script>
</body>
</html>
